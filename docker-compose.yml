version: '3.8'

services:
  # 🗄️ Database Service (Production-ready PostgreSQL)
  database:
    image: postgres:15-alpine
    container_name: ai-devops-db
    environment:
      POSTGRES_DB: devops_pipeline
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: secure_password_2024
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - ai-devops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops_user -d devops_pipeline"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 🚀 Backend Service (FastAPI + AI Engine)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-devops-backend
    environment:
      - DATABASE_URL=postgresql://devops_user:secure_password_2024@database:5432/devops_pipeline
      - WORKSPACE_PATH=/app/workspaces
      - SECRET_KEY=your-super-secret-key-change-in-production
      - DEBUG=False
    volumes:
      - ./backend:/app
      - github_workspaces:/app/workspaces
    ports:
      - "8000:8000"
    networks:
      - ai-devops-network
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 🎨 Frontend Service (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-devops-frontend
    ports:
      - "3000:3000"
    networks:
      - ai-devops-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 📊 Monitoring (Optional - Lightweight monitoring)
  monitoring:
    image: nginx:alpine
    container_name: ai-devops-monitoring
    volumes:
      - ./monitoring/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./monitoring/status.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "9090:80"
    networks:
      - ai-devops-network
    restart: unless-stopped

# 🌐 Networks
networks:
  ai-devops-network:
    driver: bridge
    name: ai-devops-network

# 💾 Volumes
volumes:
  postgres_data:
    name: ai-devops-postgres-data
  github_workspaces:
    name: ai-devops-github-workspaces