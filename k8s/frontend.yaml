apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-devops-frontend
  namespace: ai-devops
  labels:
    app: ai-devops-pipeline
    component: frontend
    tier: web
spec:
  replicas: 3  # Multiple replicas for high availability
  selector:
    matchLabels:
      app: ai-devops-pipeline
      component: frontend
  template:
    metadata:
      labels:
        app: ai-devops-pipeline
        component: frontend
        tier: web
    spec:
      containers:
      - name: frontend
        image: ai-devops-frontend:latest  # Replace with your registry
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: VITE_API_URL
          valueFrom:
            configMapKeyRef:
              name: ai-devops-config
              key: VITE_API_URL
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: ai-devops-frontend-service
  namespace: ai-devops
  labels:
    app: ai-devops-pipeline
    component: frontend
spec:
  selector:
    app: ai-devops-pipeline
    component: frontend
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-devops-frontend-hpa
  namespace: ai-devops
  labels:
    app: ai-devops-pipeline
    component: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-devops-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60