apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-devops-config
  namespace: ai-devops
  labels:
    app: ai-devops-pipeline
    component: config
data:
  # Backend Configuration
  DEBUG: "false"
  WORKSPACE_PATH: "/app/workspaces"
  APP_NAME: "AI-Powered DevOps Pipeline"
  APP_VERSION: "v2.0.0"
  BACKEND_HOST: "0.0.0.0"
  BACKEND_PORT: "8000"
  
  # Database Configuration  
  POSTGRES_DB: "devops_pipeline"
  POSTGRES_USER: "devops_user"
  
  # Frontend Configuration
  VITE_API_URL: "http://ai-devops-backend-service:8000"
  
  # AI/ML Configuration
  MODEL_PATH: "/app/models"
  PREDICTION_ACCURACY_THRESHOLD: "0.8"
  
  # GitHub Integration
  GITHUB_API_URL: "https://api.github.com"
  MAX_CLONE_SIZE_MB: "100"
  TEST_TIMEOUT_SECONDS: "300"