apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-devops-backend
  namespace: ai-devops
  labels:
    app: ai-devops-pipeline
    component: backend
    tier: api
spec:
  replicas: 2  # Start with 2 replicas, HPA will scale as needed
  selector:
    matchLabels:
      app: ai-devops-pipeline
      component: backend
  template:
    metadata:
      labels:
        app: ai-devops-pipeline
        component: backend
        tier: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: backend
        image: ai-devops-backend:latest  # Replace with your registry
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ai-devops-secrets
              key: DATABASE_URL
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ai-devops-secrets
              key: SECRET_KEY
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: ai-devops-config
              key: DEBUG
        - name: WORKSPACE_PATH
          valueFrom:
            configMapKeyRef:
              name: ai-devops-config
              key: WORKSPACE_PATH
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: ai-devops-config
              key: APP_NAME
        - name: APP_VERSION
          valueFrom:
            configMapKeyRef:
              name: ai-devops-config
              key: APP_VERSION
        volumeMounts:
        - name: workspace-volume
          mountPath: /app/workspaces
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 45
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10  # Allow up to 100 seconds for startup
      volumes:
      - name: workspace-volume
        emptyDir: {}  # Temporary storage for GitHub clones
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: ai-devops-backend-service
  namespace: ai-devops
  labels:
    app: ai-devops-pipeline
    component: backend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: http
spec:
  selector:
    app: ai-devops-pipeline
    component: backend
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-devops-backend-hpa
  namespace: ai-devops
  labels:
    app: ai-devops-pipeline
    component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-devops-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70  # Scale when CPU > 70%
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80  # Scale when Memory > 80%
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60