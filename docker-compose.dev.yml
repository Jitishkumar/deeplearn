version: '3.8'

services:
  # 🚀 Backend Service (FastAPI + AI Engine) - Development
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-devops-backend-dev
    environment:
      - DATABASE_URL=sqlite:///./devops_pipeline.db
      - WORKSPACE_PATH=/app/workspaces
      - SECRET_KEY=dev-secret-key-not-secure
      - DEBUG=True
    volumes:
      - ./backend:/app
      - github_workspaces:/app/workspaces
      - ./devops_pipeline.db:/app/devops_pipeline.db
    ports:
      - "8000:8000"
    networks:
      - ai-devops-network
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # 🎨 Frontend Service (React + Nginx) - Development  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-devops-frontend-dev
    ports:
      - "3000:3000"
    networks:
      - ai-devops-network
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000

# 🌐 Networks
networks:
  ai-devops-network:
    driver: bridge
    name: ai-devops-dev-network

# 💾 Volumes  
volumes:
  github_workspaces:
    name: ai-devops-dev-github-workspaces